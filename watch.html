<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PicoteFlix</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍿</text></svg>">  
  <link rel="stylesheet" href="assets/css/style.css">

  <style>
    .actions-container {
        display: flex;
        gap: 15px;
        margin-top: 20px;
    }
    .action-btn {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: white;
        padding: 8px 20px;
        border-radius: 50px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.9rem;
        transition: all 0.3s ease;
    }
    .action-btn:hover { background: rgba(255, 255, 255, 0.2); }
    
    /* Cores quando estão ativos */
    .action-btn.active-visto {
        background: #4ade80; /* Verde */
        color: #0a1a2f;
        border-color: #4ade80;
        font-weight: bold;
    }
    .action-btn.active-gosto {
        background: #ff4757; /* Vermelho */
        color: white;
        border-color: #ff4757;
    }
  </style>
</head>
<body>

    <div id="header-container"></div>

    <div id="main-content">

        <a href="index.html" class="back-btn">Voltar</a>

        <div id="info-area" class="info-container">
            <p style="padding:20px">A carregar detalhes...</p>
        </div>

        <div id="controls-area" class="controls-area" style="display: none;">
            <div class="series-bar">
                <div class="control-group">
                    <label>Temporada</label>
                    <select id="season-select"></select>
                </div>
                <div class="control-group">
                    <label>Episódio</label>
                    <select id="episode-select"></select>
                </div>
                <button class="btn-load" onclick="carregarVideo()">Ver Episódio</button>
            </div>
        </div>

        <div class="server-container">
            <span class="server-label">Fonte do vídeo:</span>
            <button class="server-btn active" onclick="mudarServidor(0)">Server 1</button>
            <button class="server-btn" onclick="mudarServidor(1)">Server 2</button>
            <button class="server-btn" onclick="mudarServidor(2)">Server 3</button>
            <button class="server-btn" onclick="mudarServidor(3)">Server 4</button>
        </div>

        <div class="player-wrapper">
            <div class="player-container">
                <iframe id="video-player" allowfullscreen></iframe>
            </div>
        </div>
    </div>
    
    <div id="search-results" style="display: none; padding: 20px; margin-top: 30px;">
        <h2>Resultados da Pesquisa</h2>
        <div id="results-grid" class="grid-container"></div>
    </div>

  <div id="loginRequiredModal" class="modal-overlay" style="display: none;">
    <div class="modal-box">
        <div class="modal-icon">🔒</div>
        <h2 class="modal-title">Sessão Necessária</h2>
        <p class="modal-text">
            Precisas de ter uma conta para guardar filmes e séries no teu Histórico, Favoritos ou Ver Mais Tarde.<br>É grátis e rápido! 🍿
        </p>
        <div style="display: flex; gap: 10px; margin-top: 20px;">
            <button onclick="window.location.href='login.html'" class="modal-btn" style="background: #E50914; color: white;">Entrar / Registar</button>
            
            <button onclick="window.fecharModalLogin()" class="modal-btn" style="background: #333; color: white;">Agora não</button>
        </div>
    </div>
</div>

  <script type="module">
    import { getDetails } from "./assets/js/tmdb.js";
    // --- NOVOS IMPORTS DA BASE DE DADOS ---
    import { toggleVisto, toggleGosto, toggleVerMaisTarde, verificarEstado } from "./assets/js/db-logic.js";
    import { auth, onAuthStateChanged } from "./assets/js/firebase-config.js";
    import { headerTemplate } from "./assets/js/templates.js";
    import "./assets/js/auth.js";   // Inicia a lógica do perfil
    import "./assets/js/search.js"; // Inicia a lógica de pesquisa

    // --- 2. INJETAR O CABEÇALHO (Passando o valor "true" para esconder o meio) ---
    document.getElementById("header-container").innerHTML = headerTemplate(true);

    // --- 3. FUNÇÃO GLOBAL PARA OS RESULTADOS DA PESQUISA FUNCIONAREM ---
    window.openMovie = (id, type) => window.location.href = `watch.html?tmdb=${id}&type=${type}`;

    const params = new URLSearchParams(location.search);
    const tmdbId = params.get("tmdb");
    const type = params.get("type") || "movie";

    const player = document.getElementById("video-player");
    const infoArea = document.getElementById("info-area");
    const controlsArea = document.getElementById("controls-area");
    const seasonSelect = document.getElementById("season-select");
    const episodeSelect = document.getElementById("episode-select");
    const serverBtns = document.querySelectorAll(".server-btn");

    const SERVERS = [
        "https://vsembed.ru/embed",
        "https://vidrock.net",  
        "https://vidsrc.xyz/embed",
        "https://vsembed.su/embed"
    ];

    let currentServerIndex = 0;
    let seasonsData = [];
    let currentMovieData = null; // Guardar dados para a BD

    async function init() {
        if (!tmdbId) return window.location.href = 'index.html';

        const dados = await getDetails(tmdbId, type);
        
        if (!dados) {
            infoArea.innerHTML = "<h2>Erro ao carregar detalhes.</h2>";
            return;
        }

        // Preparar dados para o HTML e para a Base de Dados
        const titulo = dados.title || dados.name;
        const sinopse = dados.overview || "Sem sinopse.";
        const poster = dados.poster_path 
            ? `https://image.tmdb.org/t/p/w500${dados.poster_path}` 
            : "https://placehold.co/200x300/1a1a1a/666666?text=Sem+Capa";
        const ano = (dados.release_date || dados.first_air_date || "").split("-")[0];
        const rating = dados.vote_average ? `⭐ ${dados.vote_average.toFixed(1)}` : "";
        const generosTexto = dados.genres ? dados.genres.map(g=>g.name).join(", ") : "";

        // Guardar no objeto global para usar nos botões
        currentMovieData = {
            id: tmdbId,
            title: titulo,
            poster_path: dados.poster_path,
            type: type,
            genres: dados.genres ? dados.genres.map(g => g.id) : []
        };

        // INJETAR HTML (COM OS NOVOS BOTÕES)
        infoArea.innerHTML = `
            <img src="${poster}" class="poster-img" onerror="this.onerror=null;this.src='https://placehold.co/200x300/1a1a1a/666666?text=Erro';">
            <div class="details">
                <h1>${titulo}</h1>
                <div class="meta"><span>${ano}</span> • <span>${rating}</span> • <span>${generosTexto}</span></div>
                
                <div class="actions-container">
                    <button id="btnVisto" class="action-btn">
                        <span class="icon">👁️</span> <span class="text">Marcar Visto</span>
                    </button>
                    <button id="btnGosto" class="action-btn">
                        <span class="icon">🤍</span> <span class="text">Gosto</span>
                    </button>
                    <button id="btnWatchLater" class="action-btn">
                        <span class="icon">🕒</span> <span class="text">Ver Depois</span>
                    </button>
                </div>

                <p>${sinopse}</p>
            </div>
        `;

        // LIGAR OS EVENTOS AOS BOTÕES AGORA QUE ELES EXISTEM
        configurarBotoes();

        if (type === "movie") {
            carregarVideo();
        } else {
            controlsArea.style.display = "block";
            seasonsData = (dados.seasons || []).filter(s => s.season_number > 0);
            
            seasonSelect.innerHTML = "";
            seasonsData.forEach(season => {
                seasonSelect.innerHTML += `<option value="${season.season_number}">Temporada ${season.season_number}</option>`;
            });

            seasonSelect.addEventListener("change", atualizarListaEpisodios);
            atualizarListaEpisodios(); // Isto vai carregar o vídeo também
        }
    }

    // --- NOVA FUNÇÃO: CONFIGURAR BOTÕES ---
    function configurarBotoes() {
        const btnVisto = document.getElementById("btnVisto");
        const btnGosto = document.getElementById("btnGosto");
        const btnWatchLater = document.getElementById("btnWatchLater"); 

        // 1. Verificar estado inicial quando o user faz login
        onAuthStateChanged(auth, async (user) => {
            if (user && currentMovieData) {
                const estado = await verificarEstado(type, tmdbId);
                
                if (estado.visto) {
                    btnVisto.classList.add("active-visto");
                    btnVisto.querySelector(".text").innerText = "Visto";
                }
                if (estado.gosto) {
                    btnGosto.classList.add("active-gosto");
                    btnGosto.querySelector(".icon").innerText = "❤️";
                }
                if (estado.later) {
                    btnWatchLater.classList.add("active-later");
                    btnWatchLater.querySelector(".text").innerText = "Na Lista";
                }
            }
        });

        // 2. Clique no Olho (Visto)
        btnVisto.addEventListener("click", async () => {
            if(!currentMovieData) return;
            const isVisto = await toggleVisto(currentMovieData);
            
            if (isVisto) {
                btnVisto.classList.add("active-visto");
                btnVisto.querySelector(".text").innerText = "Visto";
            } else {
                btnVisto.classList.remove("active-visto");
                btnVisto.querySelector(".text").innerText = "Marcar Visto";
            }
        });

        // 3. Clique no Coração (Gosto)
        btnGosto.addEventListener("click", async () => {
            if(!currentMovieData) return;
            const isLiked = await toggleGosto(currentMovieData);
            
            if (isLiked) {
                btnGosto.classList.add("active-gosto");
                btnGosto.querySelector(".icon").innerText = "❤️";
            } else {
                btnGosto.classList.remove("active-gosto");
                btnGosto.querySelector(".icon").innerText = "🤍";
            }
        });

        // 4. Clique no Relógio
        btnWatchLater.addEventListener("click", async () => {
            if(!currentMovieData) return;
            const isAdded = await toggleVerMaisTarde(currentMovieData);
            
            if (isAdded) {
                btnWatchLater.classList.add("active-later");
                btnWatchLater.querySelector(".text").innerText = "Na Lista";
            } else {
                btnWatchLater.classList.remove("active-later");
                btnWatchLater.querySelector(".text").innerText = "Ver Depois";
            }
        });
    }

    window.atualizarListaEpisodios = () => {
        const tempSelecionada = parseInt(seasonSelect.value);
        const dadosTemporada = seasonsData.find(s => s.season_number === tempSelecionada);
        
        episodeSelect.innerHTML = "";
        if (dadosTemporada) {
            for (let i = 1; i <= dadosTemporada.episode_count; i++) {
                episodeSelect.innerHTML += `<option value="${i}">Episódio ${i}</option>`;
            }
            // Carregar automaticamente o episódio 1 ao mudar de temporada
            carregarVideo();
        }
    };

    window.carregarVideo = () => {
        const baseUrl = SERVERS[currentServerIndex];
        let urlFinal = "";

        if (type === "movie") {
            urlFinal = `${baseUrl}/movie/${tmdbId}`;
        } else {
            const s = seasonSelect.value;
            const e = episodeSelect.value;
            urlFinal = `${baseUrl}/tv/${tmdbId}/${s}/${e}`;
        }
        
        player.src = urlFinal;
        console.log("A carregar de:", baseUrl);
    };

    window.mudarServidor = (index) => {
        currentServerIndex = index;
        serverBtns.forEach((btn, idx) => {
            if(idx === index) btn.classList.add("active");
            else btn.classList.remove("active");
        });
        carregarVideo();
    };

    window.fecharModalLogin = () => {
          const modal = document.getElementById('loginRequiredModal');
          if (modal) {
              modal.style.display = 'none';
          }
      };

    init();
  </script>

</body>
</html>
